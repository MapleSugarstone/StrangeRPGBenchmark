<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StrangeRPG5</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a12;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #66ccff;
    }
    #title-screen { text-align: center; }
    #title-screen h1 {
      font-size: 28px;
      letter-spacing: 4px;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
    }
    #title-screen .subtitle {
      color: #555;
      font-size: 10px;
      margin-bottom: 40px;
      letter-spacing: 2px;
    }
    #playBtn {
      background: transparent;
      border: 2px solid #66ccff;
      color: #66ccff;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      padding: 12px 40px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.2s;
    }
    #playBtn:hover {
      background: #66ccff;
      color: #0a0a12;
      box-shadow: 0 0 20px rgba(100, 200, 255, 0.4);
    }
    #game-screen { display: none; flex-direction: column; align-items: center; }
    #game-container {
      border: 4px solid #444;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(100, 200, 255, 0.3);
    }
    canvas { display: block; image-rendering: pixelated; }
    #game-label {
      color: #aaa;
      margin-top: 10px;
      font-size: 14px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div id="title-screen">
    <h1>STRANGE RPG 5</h1>
    <div class="subtitle">A game about broken realities</div>
    <button id="playBtn" onclick="startGame()">▶ PLAY</button>
  </div>

  <div id="game-screen">
    <div id="game-container">
      <canvas id="game" width="256" height="256"></canvas>
    </div>
    <div id="game-label">STRANGERPG5</div>
  </div>

  <script src="build/game.js"></script>
  <script>
    function startGame() {
      document.getElementById('title-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';
      document.getElementById('game').focus();
      // Instantiation is idempotent; only one Game instance will ever run.
      if (typeof Game !== 'undefined') {
        new Game();
      }
    }
  </script>
</body>
</html>
