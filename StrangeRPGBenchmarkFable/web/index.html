<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Moth Crown</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <canvas id="game" width="192" height="192"></canvas>
  <div class="pad">
    <div class="dpad">
      <button data-key="up">^</button>
      <button data-key="left">&lt;</button>
      <button data-key="down">v</button>
      <button data-key="right">&gt;</button>
    </div>
    <div class="btns">
      <button data-key="cancel">X</button>
      <button data-key="ok">Z</button>
      <button data-key="menu">C</button>
    </div>
  </div>
</main>
<script src="game.js"></script>
</body>
</html>
