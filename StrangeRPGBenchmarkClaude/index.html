<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duotone</title>
<style>
  :root { --bg: #0c0a12; --fg: #8e8a9c; --edge: #262234; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font: 12px/1.4 monospace; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; box-shadow: 0 0 0 2px var(--edge); }
  .hint { opacity: 0.75; text-align: center; padding: 0 16px; max-width: 640px; }
</style>
</head>
<body>
<canvas id="screen" width="160" height="160" tabindex="0"></canvas>
<div class="hint">Arrows or WASD move. Z, Space, or Enter confirms. X or Esc cancels and opens the menu. C uses the chapter tool. M mutes.</div>
<script src="game.js"></script>
</body>
</html>
